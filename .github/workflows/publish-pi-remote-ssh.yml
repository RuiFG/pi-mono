name: Publish pi-remote-ssh

on:
  push:
    tags:
      - 'pi-remote-ssh-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-remote-ssh-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release metadata and helper
        run: |
          node --test .github/scripts/pi-remote-ssh-release.test.mjs
          node .github/scripts/pi-remote-ssh-release.mjs metadata
      - run: npm ci
      - run: npm run check --workspace pi-remote-ssh
      - run: npm run test:integration --workspace pi-remote-ssh
      - run: npm run test:package --workspace pi-remote-ssh
      - run: npm run test:native-tui --workspace pi-remote-ssh
      - name: Pack the validated source
        run: |
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/pi-release"
          npm pack --workspace pi-remote-ssh --ignore-scripts --json --pack-destination "$RUNNER_TEMP/pi-release" > "$RUNNER_TEMP/pi-release/pack.json"
          node .github/scripts/pi-remote-ssh-release.mjs artifact "$RUNNER_TEMP/pi-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-remote-ssh-release
          path: ${{ runner.temp }}/pi-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish to npm via OIDC
    needs: verify
    if: github.repository == 'RuiFG/pi-mono' && startsWith(github.ref, 'refs/tags/pi-remote-ssh-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Require an OIDC-capable npm CLI
        run: |
          npm --version
          node -e 'const [major, minor, patch] = require("node:child_process").execFileSync("npm", ["--version"], {encoding: "utf8"}).trim().split(".").map(Number); if (!(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) throw new Error("npm 11.5.1 or newer is required")'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-remote-ssh-release
          path: ${{ runner.temp }}/pi-release
      - name: Verify artifact and check for a completed publish
        id: package
        run: node .github/scripts/pi-remote-ssh-release.mjs check-registry "$RUNNER_TEMP/pi-release"
      - name: Publish the exact tested tarball
        if: steps.package.outputs.state == 'missing'
        env:
          TARBALL: ${{ steps.package.outputs.filename }}
          NPM_TAG: ${{ steps.package.outputs.npm_tag }}
        run: npm publish "$RUNNER_TEMP/pi-release/$TARBALL" --ignore-scripts --access public --tag "$NPM_TAG" --registry=https://registry.npmjs.org/
      - name: Verify published integrity
        run: node .github/scripts/pi-remote-ssh-release.mjs verify-registry "$RUNNER_TEMP/pi-release"

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pi-remote-ssh-release
          path: ${{ runner.temp }}/pi-release
      - name: Recheck the published artifact
        id: package
        run: node .github/scripts/pi-remote-ssh-release.mjs verify-registry "$RUNNER_TEMP/pi-release"
      - name: Create release and attach the npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.package.outputs.filename }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
            gh release create "$TAG" --verify-tag --title "pi-remote-ssh $VERSION" --generate-notes "${flags[@]}"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/pi-release/$TARBALL" --clobber
